name: CI/CD Pipeline for Mosquitto with TLS

on:
  push:
    branches:
      - preprod
    tags:
      - '*'
    paths:
      - "mqtt-pp/**"
  pull_request:
    branches:
      - preprod
    paths:
      - "mqtt-pp/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Docker image version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=preprod-${{ github.sha }}" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image with multiple tags
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t krosand/mosquitto-tls:${{ env.IMAGE_TAG }} \
        -t krosand/mosquitto-tls:preprod \
        --push .

    - name: Verify mosquitto.conf and TLS certificates exist in the Docker image
      run: |
        docker pull krosand/mosquitto-tls:${{ env.IMAGE_TAG }}
        docker create --name temp-container krosand/mosquitto-tls:${{ env.IMAGE_TAG }}
        docker cp temp-container:/mosquitto/config/mosquitto.conf ./mosquitto.conf || (echo "mosquitto.conf not found!" && exit 1)
        docker cp temp-container:/mosquitto/config/server.crt ./server.crt || (echo "TLS certificates not found!" && exit 1)
        docker rm temp-container

    - name: Delete image from DockerHub on failure
      if: failure()
      run: |
        echo "Pipeline failed, deleting image from DockerHub..."
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker rmi krosand/mosquitto-tls:${{ env.IMAGE_TAG }} || true
        docker rmi krosand/mosquitto-tls:preprod || true

