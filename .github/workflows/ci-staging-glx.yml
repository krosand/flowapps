name: CI/CD Pipeline Preprod glx

on:
  push:
    branches:
      - preprod
    tags:
      - '*'
  pull_request:
    branches:
      - preprod

jobs:
  build-preprod:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set the Docker image version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=preprod-${{ github.sha }}" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image with multiple tags
      run: |
        cd gaulix.fr
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t krosand/www-glx:${{ env.IMAGE_TAG }} \
        -t krosand/www-glx:preprod \
        --push .

    - name: Verify index.html exists in the Docker image
      run: |
        docker pull krosand/www-glx:${{ env.IMAGE_TAG }}
        docker create --name temp-container krosand/www-glx:${{ env.IMAGE_TAG }}
        docker cp temp-container:/usr/share/nginx/html/index.html ./index.html || (echo "index.html not found!" && exit 1)
        docker rm temp-container
      shell: bash

    - name: Delete image from DockerHub on failure
      if: failure()  # Cette étape s'exécute uniquement si une étape précédente échoue
      run: |
        echo "Pipeline failed, deleting image from DockerHub..."
        docker rmi krosand/www-glx:${{ env.IMAGE_TAG }}
        docker rmi krosand/www-glx:preprod
        docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}
        docker image rm krosand/www-glx:${{ env.IMAGE_TAG }} || true
        docker image rm krosand/www-glx:preprod || true
