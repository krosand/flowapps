name: CI/CD Pipeline Prod glx

on:
  push:
    branches:
      - main 

jobs:
  build-prod:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image for preprod
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t krosand/pico-glx:preprod-${{ github.sha }} --push ./docker
    

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image to DockerHub
      run: |
        cd gaulix.fr
        docker push krosand/pico-glx:${{ github.sha }}
        docker tag krosand/pico-glx:${{ github.sha }} krosand/pico-glx:latest
        docker push krosand/pico-glx:latest
