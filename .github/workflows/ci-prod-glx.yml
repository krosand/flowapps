name: CI/CD Pipeline Prod glx

on:
  push:
    branches:
      - main
jobs:
  build-prod:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image for production
      run: |
        cd gaulix.fr 
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t krosand/pico-glx:${{ github.sha }} --push .

    - name: Tag and push the 'latest' Docker image
      run: |
        docker tag krosand/pico-glx:${{ github.sha }} krosand/pico-glx:latest
        docker push krosand/pico-glx:latest
